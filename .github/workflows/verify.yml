name: verify

# 1) all tests (math, eligibility rules, screening, end-to-end with a fake API)
# 2) analysis tests (with pandas/matplotlib)
# 3) live self-check on real Polymarket data (full listing + a real two-stage scan + cross-checks)
# Runs automatically when the code changes, and on demand (Actions tab -> verify -> Run workflow).
# Results are also shown as annotations on the run's summary page.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "arbscanner/**"
      - "tests/**"
      - "analysis/**"
      - ".github/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Tests
        run: |
          python3 --version
          set +e
          python3 -m unittest discover -s tests -t . -v > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ "$code" -ne 0 ]; then
            python3 .github/annotate.py error "Tests failed on $(python3 --version)" test-output.txt --failures-only
          fi
          exit "$code"

      - name: Live self-check on real Polymarket data
        run: |
          set +e
          python3 -m arbscanner selfcheck > selfcheck-output.txt 2>&1
          code=$?
          cat selfcheck-output.txt
          if [ "$code" -ne 0 ]; then level=error; else level=notice; fi
          python3 .github/annotate.py "$level" "Live self-check" selfcheck-output.txt
          exit "$code"

      - uses: actions/setup-python@v6
        if: success() || failure()
        with:
          python-version: "3.13"

      - name: Analysis tests (pandas, matplotlib)
        if: success() || failure()
        run: |
          python -m pip install --quiet -r analysis/requirements.txt
          set +e
          python -m unittest tests.test_analysis -v > analysis-output.txt 2>&1
          code=$?
          cat analysis-output.txt
          if [ "$code" -ne 0 ] || grep -q "skipped" analysis-output.txt; then
            python .github/annotate.py error "Analysis tests failed" analysis-output.txt
            exit 1
          fi
