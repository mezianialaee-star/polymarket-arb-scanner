name: verify

# 1) all tests (math, eligibility rules, end-to-end with a fake API)
# 2) live self-check on real Polymarket data
# Runs automatically when the code changes, and on demand (Actions tab -> verify -> Run workflow).
# Results are also shown as annotations on the run's summary page.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "arbscanner/**"
      - "tests/**"
      - ".github/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Tests
        run: |
          python3 --version
          set +e
          python3 -m unittest discover -s tests -t . -v > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ "$code" -ne 0 ]; then
            python3 .github/annotate.py error "Tests failed on $(python3 --version)" test-output.txt --failures-only
          fi
          exit "$code"

      - name: Live self-check on real Polymarket data
        run: |
          set +e
          python3 -m arbscanner selfcheck > selfcheck-output.txt 2>&1
          code=$?
          cat selfcheck-output.txt
          if [ "$code" -ne 0 ]; then level=error; else level=notice; fi
          python3 .github/annotate.py "$level" "Live self-check" selfcheck-output.txt
          exit "$code"
