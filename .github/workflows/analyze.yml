name: analyze

# On demand (Actions tab -> analyze -> Run workflow): builds report/ from data/.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install analysis tools
        run: python -m pip install --quiet -r analysis/requirements.txt

      - name: Build the report
        run: python analysis/analyze.py --data data --out report

      - name: Save the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report
          if git diff --cached --quiet; then
            echo "Report unchanged."
            exit 0
          fi
          git commit -q -m "report: update $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          exit 1
