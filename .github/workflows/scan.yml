name: scan

# Every 10 minutes: one scan of every multi-outcome Polymarket event. Results are saved
# in the repository (data/). The list of events (a few MB, rebuilt every hour) is kept
# in the Actions cache (state/), not in git.
on:
  schedule:
    # minutes 4, 14, 24, ...: GitHub delays schedules most at the top of the hour
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Restore the list of events
        uses: actions/cache/restore@v5
        with:
          path: state
          key: universe-${{ github.run_id }}
          restore-keys: universe-

      - name: Scan Polymarket (read-only)
        id: scan
        run: |
          python3 --version
          before=$(sha256sum state/universe.json.gz 2>/dev/null || echo none)
          set +e
          python3 -m arbscanner scan --data data --universe state/universe.json.gz
          code=$?
          set -e
          after=$(sha256sum state/universe.json.gz 2>/dev/null || echo none)
          if [ -f state/universe.json.gz ] && [ "$before" != "$after" ]; then
            echo "refreshed=1" >> "$GITHUB_OUTPUT"
            echo "The list of events was rebuilt."
          fi
          exit "$code"

      - name: Keep the new list of events
        if: always() && steps.scan.outputs.refreshed == '1'
        uses: actions/cache/save@v5
        with:
          path: state
          key: universe-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save results
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -q -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Saved."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), rebasing on the latest version..."
            git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          echo "Could not save the results."
          exit 1
