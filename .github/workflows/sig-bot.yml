name: sig-bot

# Bot for the SIG Predictions Cup (official API; bots are allowed by the Official Rules, section 6).
# It looks for riskless arbitrage between the party markets of the same race (see sig_bot/sig_bot.py).
#
# Needs the repository secret SIG_API_KEY (Settings -> Secrets and variables -> Actions).
# MODE below: "dry" = reports only, buys nothing. "live" = trades, within the limits below.
# The bot's status is saved every 10 minutes in sig_bot/status/latest.md.
# Stop: Actions -> sig-bot -> "..." -> Disable workflow (or cancel the running job).
on:
  push:
    branches: [main]
    paths:
      - "sig_bot/**"
      - "!sig_bot/status/**"
      - ".github/workflows/sig-bot.yml"
  schedule:
    - cron: "*/30 * * * *"   # safety net: starts the bot again if it stopped (one run at a time)
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run (minutes, at most 340)"
        default: "340"

permissions:
  contents: write   # save the status file

concurrency:
  group: sig-bot
  # A new version of the bot replaces the running one; scheduled runs wait their turn.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check the date
        id: gate
        run: |
          if [ "$(date -u +%Y%m%d%H%M)" -ge "202611041645" ]; then
            echo "The competition is over: the bot does not start."
            echo "active=0" >> "$GITHUB_OUTPUT"
          else
            echo "active=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.active == '1'

      - name: Run the bot
        if: steps.gate.outputs.active == '1'
        env:
          SIG_API_KEY: ${{ secrets.SIG_API_KEY }}
          MODE: "dry"
          LIVE_CONFIRM: "no"
          RUN_MINUTES: ${{ github.event.inputs.minutes || '340' }}
          MIN_EDGE: "0.01"
          MAX_TRADE_COST: "3000"
          MAX_RUN_COST: "10000"
          CASH_RESERVE: "100"
          STATUS_PATH: sig_bot/status/latest.md
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            [ -f "$STATUS_PATH" ] || return 0
            git add "$STATUS_PATH"
            git diff --cached --quiet && return 0
            git commit -q -m "sig-bot: status $(date -u +%Y-%m-%dT%H:%MZ)" || return 0
            for attempt in 1 2 3 4 5; do
              git push -q origin "HEAD:${GITHUB_REF_NAME}" && return 0
              git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              sleep $((attempt * 3))
            done
            echo "Could not save the status this time."
          }
          python3 -I sig_bot/sig_bot.py &
          bot=$!
          last=$(date +%s)
          first=1
          while kill -0 "$bot" 2>/dev/null; do
            sleep 20
            now=$(date +%s)
            if { [ "$first" = 1 ] && [ $((now - last)) -ge 90 ]; } || [ $((now - last)) -ge 600 ]; then
              publish
              last=$now
              first=0
            fi
          done
          set +e
          wait "$bot"
          code=$?
          set -e
          publish
          exit "$code"
